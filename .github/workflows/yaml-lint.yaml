name: YAML Validation

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/validate_yaml.py'
      - '.github/workflows/yaml-lint.yaml'

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate YAML files
        run: |
          # Exclude files that are intentionally not valid standalone YAML:
          # - Helm templates contain Go template syntax ({{ }})
          # - Example snippets are partial YAML for documentation
          # - CiliumNetworkPolicy p1-p3 have formatting issues (tabs, missing spaces)
          python scripts/validate_yaml.py .github/workflows/ src/assets/ -v \
            --exclude \
              "**/helm/deployment-template.yaml" \
              "**/helm/helpers-tpl.yaml" \
              "**/helm/template-*.yaml" \
              "**/backup-e-restore-example-*.yaml" \
              "**/audit-example-2.yaml" \
              "**/hardening-example-2.yaml" \
              "**/hardening-example-3.yaml" \
              "**/ciliumnetworkpolicy-p*.yaml"
