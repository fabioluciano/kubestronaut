name: Spellcheck

on:
  pull_request:
    paths:
      - "src/**/*.md"

jobs:
  spellcheck:
    name: Check Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install @cspell/dict-pt-br

      - name: Run spellcheck
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: "./cspell.json"
          files: |
            src/**/*.md
          inline: warning
          strict: false
          suggestions: true
