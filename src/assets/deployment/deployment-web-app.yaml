apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: secure-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
