apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app: my-app
  ports:
  - port: 80
    targetPort: 8080
  # Habilitar session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      # Tempo em segundos para manter afinidade
      timeoutSeconds: 10800  # 3 horas
