apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-db-slice
  labels:
    kubernetes.io/service-name: external-database
addressType: IPv4
ports:
- name: postgres
  port: 5432
  protocol: TCP
endpoints:
- addresses:
  - "192.168.1.100"
  conditions:
    ready: true
  nodeName: ""
- addresses:
  - "192.168.1.101"
  conditions:
    ready: true
