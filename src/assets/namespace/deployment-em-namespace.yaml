apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: development  # Especificar namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.21
