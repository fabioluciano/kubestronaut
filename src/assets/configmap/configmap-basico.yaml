apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Valores simples
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  LOG_LEVEL: "info"
  
  # Arquivo de configuração completo
  config.yaml: |
    server:
      port: 8080
      timeout: 30s
    logging:
      level: info
      format: json
