apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-proxy
  namespace: kube-system
data:
  config.conf: |
    apiVersion: kubeproxy.config.k8s.io/v1alpha1
    kind: KubeProxyConfiguration
    # Modo de operacao: iptables, ipvs, nftables, ou kernelspace (Windows)
    mode: "ipvs"
    # Configuracoes IPVS
    ipvs:
      # Algoritmo de balanceamento
      scheduler: "rr"
      # Habilitar strict ARP (necessario para MetalLB)
      strictARP: true
      # Timeout de conexoes TCP
      tcpTimeout: 0s
      tcpFinTimeout: 0s
      udpTimeout: 0s
    # Configuracoes iptables
    iptables:
      # Intervalo de sync das regras
      syncPeriod: 30s
      # Tempo minimo entre syncs
      minSyncPeriod: 1s
    # CIDR dos ClusterIPs
    clusterCIDR: "10.96.0.0/12"
    # Porta de metricas
    metricsBindAddress: "0.0.0.0:10249"
    # Porta de healthz
    healthzBindAddress: "0.0.0.0:10256"
