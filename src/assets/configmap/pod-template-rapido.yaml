apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
  - name: app
    image: nginx
    envFrom:
    - configMapRef:
        name: my-config
    # OU
    env:
    - name: KEY
      valueFrom:
        configMapKeyRef:
          name: my-config
          key: KEY
    # OU
    volumeMounts:
    - name: config
      mountPath: /etc/config
  volumes:
  - name: config
    configMap:
      name: my-config
