apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  app.properties: |
    server.port=8080
    server.timeout=30
    cache.enabled=true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: myapp:1.0
        envFrom:
        - configMapRef:
            name: webapp-config
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        configMap:
          name: webapp-config
          items:
          - key: app.properties
            path: application.properties
