apiVersion: v1
kind: Pod
metadata:
  name: my-app
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: config-volume
      mountPath: /etc/config
      readOnly: true
  volumes:
  - name: config-volume
    configMap:
      name: app-config
      # Cada chave do ConfigMap vira um arquivo
      # /etc/config/DB_HOST
      # /etc/config/DB_PORT
      # /etc/config/config.yaml
