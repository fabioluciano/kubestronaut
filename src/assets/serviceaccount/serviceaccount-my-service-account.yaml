# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-service-account
  namespace: default
# automountServiceAccountToken: true (padrao)
---
# Pod usando ServiceAccount
apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  namespace: default
spec:
  serviceAccountName: my-service-account
  containers:
  - name: app
    image: my-app:latest
    # Token montado automaticamente em:
    # /var/run/secrets/kubernetes.io/serviceaccount/
    # - token: JWT token
    # - ca.crt: CA do cluster
    # - namespace: namespace do pod
