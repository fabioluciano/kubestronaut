# ClusterRole: permissoes em todo o cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# Recursos nao-namespaced
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
# Non-resource URLs
- nonResourceURLs: ["/healthz", "/livez", "/readyz"]
  verbs: ["get"]
---
# ClusterRoleBinding: associacao cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-reader-global
subjects:
- kind: Group
  name: security-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
