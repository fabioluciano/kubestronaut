apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  # Apenas nodes com gVisor instalado
  nodeSelector:
    runtime.gvisor.dev/enabled: "true"
  # Tolerations para nodes dedicados
  tolerations:
  - key: "runtime"
    operator: "Equal"
    value: "gvisor"
    effect: "NoSchedule"
