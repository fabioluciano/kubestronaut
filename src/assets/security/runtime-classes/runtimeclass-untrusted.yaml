# RuntimeClass para código não-confiável
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: untrusted
handler: runsc
scheduling:
  nodeSelector:
    workload-type: untrusted
---
# Pod executando código de terceiros
apiVersion: v1
kind: Pod
metadata:
  name: user-code-executor
spec:
  runtimeClassName: untrusted
  containers:
  - name: sandbox
    image: code-runner:latest
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
