# RuntimeClass completo com todos os campos
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    security-level: high
    runtime-type: sandbox
  annotations:
    description: "gVisor runtime para workloads nao confiaveis"
# Handler deve corresponder ao nome no containerd config
handler: runsc
# Overhead de recursos consumidos pelo runtime
overhead:
  podFixed:
    cpu: "100m"
    memory: "50Mi"
# Restricoes de scheduling
scheduling:
  nodeSelector:
    runtime.class/gvisor: "true"
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
  labels:
    security-level: maximum
    runtime-type: vm
  annotations:
    description: "Kata Containers para isolamento de hardware"
handler: kata-qemu
overhead:
  podFixed:
    cpu: "250m"
    memory: "160Mi"
scheduling:
  nodeSelector:
    runtime.class/kata: "true"
  tolerations:
  - key: "runtime"
    operator: "Equal"
    value: "kata"
    effect: "NoSchedule"
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh
  labels:
    security-level: maximum
    runtime-type: vm
  annotations:
    description: "Kata com Cloud Hypervisor (mais leve)"
handler: kata-clh
overhead:
  podFixed:
    cpu: "150m"
    memory: "100Mi"
scheduling:
  nodeSelector:
    runtime.class/kata-clh: "true"
