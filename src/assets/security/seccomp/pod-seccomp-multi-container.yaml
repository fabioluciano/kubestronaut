apiVersion: v1
kind: Pod
metadata:
  name: multi-container-seccomp
spec:
  containers:
  - name: app1
    image: nginx
    securityContext:
      seccompProfile:
        type: RuntimeDefault
  - name: app2
    image: busybox
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/fine-grained.json
