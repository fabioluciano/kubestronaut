# /etc/kubernetes/audit-policy.yaml
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Não logar requests de health check
  - level: None
    resources:
      - group: ""
        resources: ["endpoints", "services"]
    verbs: ["get", "list", "watch"]
  
  # Logar secrets com metadata apenas
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets"]
  
  # Logar tudo sobre pods com request/response
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods"]
  
  # Default: metadata para tudo mais
  - level: Metadata
