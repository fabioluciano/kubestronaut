# /etc/kubernetes/manifests/kube-apiserver.yaml
# Configuracao completa de hardening do API Server
apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
  namespace: kube-system
  labels:
    component: kube-apiserver
    tier: control-plane
spec:
  containers:
  - name: kube-apiserver
    image: registry.k8s.io/kube-apiserver:v1.29.0
    command:
    - kube-apiserver

    # === AUTENTICACAO ===
    # Desabilitar anonymous auth (CIS 1.2.1)
    - --anonymous-auth=false

    # Certificados de cliente
    - --client-ca-file=/etc/kubernetes/pki/ca.crt

    # === AUTORIZACAO ===
    # Modo de autorizacao (CIS 1.2.7-8)
    - --authorization-mode=Node,RBAC

    # === ADMISSION CONTROLLERS ===
    # Controllers recomendados (CIS 1.2.10-16)
    - --enable-admission-plugins=NodeRestriction,PodSecurity,ServiceAccount,LimitRanger,ResourceQuota,DefaultStorageClass,DefaultTolerationSeconds,MutatingAdmissionWebhook,ValidatingAdmissionWebhook

    # === AUDITORIA ===
    # Logs de auditoria (CIS 1.2.22-25)
    - --audit-log-path=/var/log/kubernetes/audit.log
    - --audit-log-maxage=30
    - --audit-log-maxbackup=10
    - --audit-log-maxsize=100
    - --audit-policy-file=/etc/kubernetes/audit-policy.yaml

    # === TLS ===
    # Versao minima TLS (CIS 1.2.30)
    - --tls-min-version=VersionTLS12

    # Cipher suites seguros (CIS 1.2.31)
    - --tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

    # Certificados TLS
    - --tls-cert-file=/etc/kubernetes/pki/apiserver.crt
    - --tls-private-key-file=/etc/kubernetes/pki/apiserver.key

    # === KUBELET ===
    # Autenticacao para kubelet (CIS 1.2.4-5)
    - --kubelet-certificate-authority=/etc/kubernetes/pki/ca.crt
    - --kubelet-client-certificate=/etc/kubernetes/pki/apiserver-kubelet-client.crt
    - --kubelet-client-key=/etc/kubernetes/pki/apiserver-kubelet-client.key

    # === ETCD ===
    # Conexao segura com etcd
    - --etcd-cafile=/etc/kubernetes/pki/etcd/ca.crt
    - --etcd-certfile=/etc/kubernetes/pki/apiserver-etcd-client.crt
    - --etcd-keyfile=/etc/kubernetes/pki/apiserver-etcd-client.key
    - --etcd-servers=https://127.0.0.1:2379

    # === ENCRYPTION ===
    # Criptografia at rest (CIS 1.2.33)
    - --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml

    # === SERVICE ACCOUNT ===
    # Validacao de service accounts (CIS 1.2.26)
    - --service-account-lookup=true
    - --service-account-key-file=/etc/kubernetes/pki/sa.pub
    - --service-account-signing-key-file=/etc/kubernetes/pki/sa.key
    - --service-account-issuer=https://kubernetes.default.svc.cluster.local

    # === PROFILING ===
    # Desabilitar profiling (CIS 1.2.21)
    - --profiling=false

    # === OUTROS ===
    # Bind address
    - --bind-address=0.0.0.0
    - --secure-port=6443

    # Request timeout
    - --request-timeout=60s

    # Rate limiting
    - --max-requests-inflight=400
    - --max-mutating-requests-inflight=200

    volumeMounts:
    - name: k8s-certs
      mountPath: /etc/kubernetes/pki
      readOnly: true
    - name: ca-certs
      mountPath: /etc/ssl/certs
      readOnly: true
    - name: etcd-certs
      mountPath: /etc/kubernetes/pki/etcd
      readOnly: true
    - name: encryption
      mountPath: /etc/kubernetes/enc
      readOnly: true
    - name: audit-policy
      mountPath: /etc/kubernetes/audit-policy.yaml
      readOnly: true
    - name: audit-logs
      mountPath: /var/log/kubernetes

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

    livenessProbe:
      httpGet:
        path: /livez
        port: 6443
        scheme: HTTPS
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 8

    readinessProbe:
      httpGet:
        path: /readyz
        port: 6443
        scheme: HTTPS
      periodSeconds: 1
      timeoutSeconds: 15

  hostNetwork: true
  priorityClassName: system-node-critical

  volumes:
  - name: k8s-certs
    hostPath:
      path: /etc/kubernetes/pki
      type: DirectoryOrCreate
  - name: ca-certs
    hostPath:
      path: /etc/ssl/certs
      type: DirectoryOrCreate
  - name: etcd-certs
    hostPath:
      path: /etc/kubernetes/pki/etcd
      type: DirectoryOrCreate
  - name: encryption
    hostPath:
      path: /etc/kubernetes/enc
      type: DirectoryOrCreate
  - name: audit-policy
    hostPath:
      path: /etc/kubernetes/audit-policy.yaml
      type: File
  - name: audit-logs
    hostPath:
      path: /var/log/kubernetes
      type: DirectoryOrCreate
