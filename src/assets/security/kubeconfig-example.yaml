apiVersion: v1
kind: Config
current-context: myuser-context

clusters:
- name: kubernetes
  cluster:
    server: https://api-server:6443
    certificate-authority: /path/to/ca.crt

users:
- name: myuser
  user:
    client-certificate: /path/to/user.crt
    client-key: /path/to/user.key

contexts:
- name: myuser-context
  context:
    cluster: kubernetes
    user: myuser
    namespace: default
