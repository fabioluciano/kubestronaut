- rule: Reverse Shell
  desc: Detecta possível reverse shell
  condition: >
    spawned_process and 
    container and 
    ((proc.name = nc or proc.name = ncat) and 
     (proc.args contains "-e" or proc.args contains "-c"))
  output: >
    Reverse shell detected 
    (user=%user.name container=%container.name cmdline=%proc.cmdline)
  priority: CRITICAL
