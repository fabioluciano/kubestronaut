apiVersion: batch/v1
kind: CronJob
metadata:
  name: concurrent-cron
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid  # Não permite execução concorrente
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: busybox
            command: ["sh", "-c", "echo Start; sleep 90; echo End"]
          restartPolicy: OnFailure
