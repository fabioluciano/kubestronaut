apiVersion: v1
kind: Pod
metadata:
  name: my-app
spec:
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
  volumes:
  - name: secret-volume
    secret:
      secretName: db-credentials
      items:
      - key: password
        path: db-password.txt  # Arquivo: /etc/secrets/db-password.txt
        mode: 0400
