apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
  namespace: app-namespace
spec:
  # Gateway(s) ao qual esta route se conecta
  parentRefs:
    - name: main-gateway
      namespace: gateway-system
      sectionName: http  # Listener específico (opcional)
  
  # Hostnames que esta route responde
  hostnames:
    - "app.example.com"
    - "*.example.com"
  
  # Regras de roteamento
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-service
          port: 8080
          weight: 100
