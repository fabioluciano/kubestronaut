apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-route
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - "api.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # 90% do tráfego para v1
        - name: api-v1
          port: 8080
          weight: 90
        # 10% do tráfego para v2 (canary)
        - name: api-v2
          port: 8080
          weight: 10
