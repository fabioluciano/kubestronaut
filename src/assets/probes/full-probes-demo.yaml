apiVersion: v1
kind: Pod
metadata:
  name: full-probes-demo
spec:
  containers:
  - name: app
    image: my-app:v1
    ports:
    - containerPort: 8080
    
    # Probe de startup para aplicação lenta
    startupProbe:
      httpGet:
        path: /healthz
        port: 8080
      failureThreshold: 30
      periodSeconds: 10
    
    # Probe de liveness para detectar deadlock
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    
    # Probe de readiness para controlar tráfego
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
