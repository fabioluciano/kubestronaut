apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolate-namespace
  namespace: secure
spec:
  endpointSelector: {}  # Seleciona todos os pods
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: secure
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: secure
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
