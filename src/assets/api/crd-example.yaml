# Custom Resource Definition (CRD)
# Permite estender a API do Kubernetes com recursos customizados

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.database.example.com
spec:
  group: database.example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - database
            - schedule
            properties:
              database:
                type: string
                description: "Nome do banco de dados"
              schedule:
                type: string
                description: "Schedule no formato cron"
              retention:
                type: integer
                default: 7
                description: "Dias para manter backups"
          status:
            type: object
            properties:
              lastBackup:
                type: string
              lastBackupStatus:
                type: string
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Database
      type: string
      jsonPath: .spec.database
    - name: Schedule
      type: string
      jsonPath: .spec.schedule
    - name: Last Backup
      type: string
      jsonPath: .status.lastBackup
  scope: Namespaced
  names:
    plural: backups
    singular: backup
    kind: Backup
    shortNames:
    - bkp

---

# Exemplo de Custom Resource (CR) usando o CRD acima
apiVersion: database.example.com/v1
kind: Backup
metadata:
  name: mysql-daily-backup
  namespace: production
spec:
  database: mysql-primary
  schedule: "0 2 * * *"
  retention: 30
