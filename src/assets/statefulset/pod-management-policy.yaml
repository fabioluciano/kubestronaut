apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web-headless
  replicas: 4
  podManagementPolicy: Parallel  # Cria/deleta todos simultaneamente
  # podManagementPolicy: OrderedReady  # Padrão: sequencial
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx
