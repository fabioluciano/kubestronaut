apiVersion: v1
kind: Service
metadata:
  name: NOME-headless
spec:
  clusterIP: None
  selector:
    app: LABEL
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: NOME
spec:
  serviceName: NOME-headless
  replicas: 3
  selector:
    matchLabels:
      app: LABEL
  template:
    metadata:
      labels:
        app: LABEL
    spec:
      containers:
      - name: CONTAINER
        image: IMAGE
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
