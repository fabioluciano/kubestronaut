apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Recursos base a incluir
resources:
- deployment.yaml
- service.yaml
- configmap.yaml

# Ou referenciar outra base
resources:
- ../../base

# Prefixo/Sufixo para todos os nomes
namePrefix: dev-
nameSuffix: -v1

# Labels comuns
commonLabels:
  app: myapp
  env: dev

# Annotations comuns
commonAnnotations:
  owner: team-a

# Namespace para todos recursos
namespace: my-namespace

# Patches
patches:
- path: patch-replicas.yaml

# Gerar ConfigMaps
configMapGenerator:
- name: app-config
  files:
  - config.properties

# Gerar Secrets
secretGenerator:
- name: app-secrets
  literals:
  - password=secret123

# Imagens
images:
- name: nginx
  newName: my-registry/nginx
  newTag: v2.0
