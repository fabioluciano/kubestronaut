# overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namePrefix: dev-
namespace: development

commonLabels:
  env: dev

# Patch inline
patches:
- target:
    kind: Deployment
    name: nginx
  patch: |
    - op: replace
      path: /spec/replicas
      value: 1
