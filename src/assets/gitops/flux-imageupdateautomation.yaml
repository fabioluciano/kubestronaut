apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: my-app
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: my-app
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux
        email: flux@myorg.com
      messageTemplate: "Update image to {{.NewVersion}}"
    push:
      branch: main
  update:
    path: ./k8s
    strategy: Setters
