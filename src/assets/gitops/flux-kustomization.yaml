apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: my-app
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: my-app
  path: ./k8s
  prune: true
  targetNamespace: production
  healthChecks:
  - kind: Deployment
    name: my-app
    namespace: production
