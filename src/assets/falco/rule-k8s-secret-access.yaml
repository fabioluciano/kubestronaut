- rule: K8s Secret Access
  desc: Detect access to secrets
  condition: >
    ka.verb in (get, list) and 
    ka.target.resource = secrets
  output: >
    K8s secret accessed 
    (user=%ka.user.name verb=%ka.verb 
    secret=%ka.target.name ns=%ka.target.namespace)
  priority: WARNING
  source: k8s_audit
  tags: [k8s, secrets]
