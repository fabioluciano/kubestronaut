apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend    # Seleciona pods com esta label
    tier: web
  ports:
    - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    app: frontend    # Match com o service
    tier: web
spec:
  containers:
  - name: nginx
    image: nginx
