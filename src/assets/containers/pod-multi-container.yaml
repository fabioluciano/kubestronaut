apiVersion: v1
kind: Pod
metadata:
  name: multi-container
spec:
  containers:
  # Container principal
  - name: app
    image: myapp:1.0
    ports:
    - containerPort: 8080
  
  # Sidecar (logs, proxy, etc)
  - name: sidecar
    image: busybox
    command: ['sh', '-c', 'tail -f /var/log/app.log']
    volumeMounts:
    - name: logs
      mountPath: /var/log
  
  volumes:
  - name: logs
    emptyDir: {}
