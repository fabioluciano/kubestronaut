apiVersion: v1
kind: Config
clusters:
  - name: kubernetes
    cluster:
      certificate-authority-data: <ca-base64>
      server: https://192.168.1.100:6443
users:
  - name: john
    user:
      client-certificate-data: <cert-base64>
      client-key-data: <key-base64>
contexts:
  - name: john-context
    context:
      cluster: kubernetes
      user: john
      namespace: default
current-context: john-context
