apiVersion: v1
kind: Pod
metadata:
  name: security-demo
spec:
  # Security Context do Pod (aplicado a todos containers)
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  
  containers:
  - name: app
    image: nginx
    # Security Context do Container (sobrescreve Pod)
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE    # Bind portas < 1024
