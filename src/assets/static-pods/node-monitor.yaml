# /etc/kubernetes/manifests/node-monitor.yaml
apiVersion: v1
kind: Pod
metadata:
  name: node-monitor
  labels:
    component: monitoring
spec:
  hostNetwork: true
  containers:
  - name: node-exporter
    image: prom/node-exporter:v1.5.0
    args:
    - '--path.rootfs=/host'
    ports:
    - containerPort: 9100
      hostPort: 9100
    volumeMounts:
    - name: rootfs
      mountPath: /host
      readOnly: true
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
  volumes:
  - name: rootfs
    hostPath:
      path: /
