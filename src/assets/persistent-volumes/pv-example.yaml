apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-example
spec:
  capacity:
    storage: 10Gi
  
  volumeMode: Filesystem  # ou Block
  
  accessModes:
  - ReadWriteOnce
  
  persistentVolumeReclaimPolicy: Retain
  
  storageClassName: manual
  
  # Backend específico (exemplo: hostPath)
  hostPath:
    path: /mnt/data
