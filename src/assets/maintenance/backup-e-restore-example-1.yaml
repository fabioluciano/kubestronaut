# No manifesto do etcd, verificar se o volumeMount aponta para o novo path
# etcd.yaml (seção relevante)
apiVersion: v1
kind: Pod
metadata:
  name: etcd
  namespace: kube-system
spec:
  containers:
  - name: etcd
    command:
    - etcd
    - --data-dir=/var/lib/etcd-from-backup  # Novo path
    volumeMounts:
    - mountPath: /var/lib/etcd-from-backup  # Deve corresponder
      name: etcd-data
  volumes:
  - hostPath:
      path: /var/lib/etcd-from-backup       # Novo path no host
      type: DirectoryOrCreate
    name: etcd-data
