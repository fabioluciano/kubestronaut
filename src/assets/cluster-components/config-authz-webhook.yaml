# /etc/kubernetes/auth/webhook-authz-config.yaml
apiVersion: v1
kind: Config
clusters:
- name: authz-webhook
  cluster:
    certificate-authority: /etc/kubernetes/pki/webhook-ca.crt
    server: https://authz-service.example.com/authorize
users:
- name: kube-apiserver
  user:
    client-certificate: /etc/kubernetes/pki/apiserver.crt
    client-key: /etc/kubernetes/pki/apiserver.key
current-context: webhook
contexts:
- context:
    cluster: authz-webhook
    user: kube-apiserver
  name: webhook
