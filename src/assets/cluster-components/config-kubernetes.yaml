# ~/.kube/config
apiVersion: v1
kind: Config
clusters:
- name: kubernetes
  cluster:
    certificate-authority: /etc/kubernetes/pki/ca.crt
    # ou certificate-authority-data: <base64-encoded-ca>
    server: https://192.168.1.10:6443
users:
- name: john
  user:
    client-certificate: /home/john/.certs/john.crt
    client-key: /home/john/.certs/john.key
    # ou client-certificate-data e client-key-data com base64
contexts:
- name: john@kubernetes
  context:
    cluster: kubernetes
    user: john
    namespace: default
current-context: john@kubernetes
