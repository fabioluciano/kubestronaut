apiVersion: v1
kind: LimitRange
metadata:
  name: complete-limits
  namespace: development
spec:
  limits:
  # Limites para Containers
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    min:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "2"
      memory: "2Gi"
    maxLimitRequestRatio:  # Limite / Request não pode exceder
      cpu: "4"
      memory: "4"
  # Limites para Pods
  - type: Pod
    min:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "4"
      memory: "4Gi"
  # Limites para PVCs
  - type: PersistentVolumeClaim
    min:
      storage: "1Gi"
    max:
      storage: "50Gi"
