# Namespace com ambos
apiVersion: v1
kind: Namespace
metadata:
  name: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: restricted
spec:
  limits:
  - type: Container
    default:
      cpu: "200m"
      memory: "256Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: restricted
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
