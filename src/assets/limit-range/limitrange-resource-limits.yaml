apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: development
spec:
  limits:
  # Limites para containers
  - type: Container
    default:          # Limit padrao se nao especificado
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:   # Request padrao se nao especificado
      cpu: "100m"
      memory: "128Mi"
    max:              # Maximo permitido
      cpu: "2"
      memory: "2Gi"
    min:              # Minimo permitido
      cpu: "50m"
      memory: "64Mi"
  # Limites para pods
  - type: Pod
    max:
      cpu: "4"
      memory: "4Gi"
  # Limites para PVC
  - type: PersistentVolumeClaim
    max:
      storage: "50Gi"
    min:
      storage: "1Gi"
