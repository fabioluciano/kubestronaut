apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: NAMESPACE
spec:
  limits:
  - type: Container
    default:          # Limits padrão
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:   # Requests padrão
      cpu: "100m"
      memory: "128Mi"
    min:              # Mínimo
      cpu: "50m"
      memory: "64Mi"
    max:              # Máximo
      cpu: "2"
      memory: "2Gi"
