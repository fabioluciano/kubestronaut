apiVersion: v1
kind: LimitRange
metadata:
  name: pod-limits
  namespace: development
spec:
  limits:
  - type: Pod
    min:              # Mínimo para soma de todos containers
      cpu: "100m"
      memory: "128Mi"
    max:              # Máximo para soma de todos containers
      cpu: "4"
      memory: "4Gi"
