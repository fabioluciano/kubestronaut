apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.example.com
spec:
  group: example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - engine
            - size
            properties:
              engine:
                type: string
                enum:                   # Valores permitidos
                - postgres
                - mysql
                - mongodb
              size:
                type: string
                pattern: '^[0-9]+Gi$'   # Regex
              replicas:
                type: integer
                minimum: 1              # Valor mínimo
                maximum: 10             # Valor máximo
                default: 1              # Valor padrão
  scope: Namespaced
  names:
    plural: databases
    singular: database
    kind: Database
    shortNames:
    - db
