apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.example.com
spec:
  group: example.com
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:           # Colunas no kubectl get
    - name: Domain
      type: string
      jsonPath: .spec.domain
    - name: Status
      type: string
      jsonPath: .status.state
    - name: Expires
      type: string
      jsonPath: .status.expiresAt
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              domain:
                type: string
          status:
            type: object
            properties:
              state:
                type: string
              expiresAt:
                type: string
  scope: Namespaced
  names:
    plural: certificates
    singular: certificate
    kind: Certificate
    shortNames:
    - cert
